\* QUESTION: route the balancer on a salt-independent shard, so one visitor always lands on one worker. No extra lock.
\* EXPECTED: One lock, zero added cost - but the stale old-key entry may still be there.
SPECIFICATION Spec

CONSTANTS
    Requests = {r1, r2, r3}
    MaxEpoch = 2
    NULL     = NULL
    SaltRotates      = TRUE
    CallerTimeout    = FALSE
    FixLockBothKeys           = FALSE
    FixRekeyCoherent          = FALSE
    FixLockOnMissOnly         = FALSE
    FixSaltIndependentRouting = TRUE
    FixNoCrossRotationStitch  = FALSE

INVARIANT TypeOK
INVARIANT VisitsCorrect
INVARIANT EventsCorrect
INVARIANT NoDoubleCancel
INVARIANT BounceCorrect
INVARIANT NoNegativeBounce
INVARIANT NoLostUpdate
INVARIANT EventRowsMatch
INVARIANT NoSessionSplit
