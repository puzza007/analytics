\* QUESTION: with no salt rotation and no caller timeout, does the Balancer
\* actually serialise everything, so sign accounting is exact?
\* EXPECTED: PASS.  This is the model's sanity floor - if it fails, the spec is
\* wrong, not the code.  Every request reads epoch 1, so all hash to one worker.
SPECIFICATION Spec

CONSTANTS
    Requests = {r1, r2, r3}
    MaxEpoch = 2
    NULL     = NULL
    SaltRotates      = FALSE
    CallerTimeout    = FALSE
    FixLockBothKeys  = FALSE
    FixRekeyCoherent = FALSE
    FixLockOnMissOnly         = FALSE
    FixSaltIndependentRouting = FALSE
    FixNoCrossRotationStitch  = FALSE

INVARIANT TypeOK
INVARIANT VisitsCorrect
INVARIANT EventsCorrect
INVARIANT NoDoubleCancel
INVARIANT BounceCorrect
INVARIANT NoNegativeBounce
INVARIANT NoLostUpdate
INVARIANT EventRowsMatch
INVARIANT NoSessionSplit
