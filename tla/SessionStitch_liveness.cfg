\* QUESTION: does the two-key locking fix deadlock the balancer? A fix that
\* never completes a request would satisfy every safety property vacuously.
\* EXPECTED: PASS. Locks are acquired atomically, so no hold-and-wait.
SPECIFICATION Spec

CONSTANTS
    Requests = {r1, r2, r3}
    MaxEpoch = 2
    NULL     = NULL
    SaltRotates      = TRUE
    CallerTimeout    = FALSE
    FixLockBothKeys  = TRUE
    FixRekeyCoherent = TRUE
    FixLockOnMissOnly         = FALSE
    FixSaltIndependentRouting = FALSE
    FixNoCrossRotationStitch  = FALSE

PROPERTY EveryRequestCompletes
